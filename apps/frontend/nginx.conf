# Cogniva frontend + reverse proxy to the backend.
#
# Serves the built SPA and forwards API / health / WebSocket traffic to the
# backend container (service name `backend` on the docker network, port 8000).
# This keeps the browser on a single origin, so the backend's localhost-only
# CORS rule never blocks requests.

upstream cogniva_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Whiteboard snapshots and audio clips arrive base64-encoded in the JSON
    # body — the backend accepts up to 50 MB, so nginx must not cap it lower.
    client_max_body_size 50m;

    # REST API (session lifecycle, workspaces, topics).
    location /api/ {
        proxy_pass http://cogniva_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM turns can take a while — allow long-lived upstream responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check passthrough (handy for probes hitting the frontend origin).
    location = /health {
        proxy_pass http://cogniva_backend;
    }

    # WebSocket session channel (/ws/sessions/:id).
    location /ws/ {
        proxy_pass http://cogniva_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
